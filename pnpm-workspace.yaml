packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false

onlyBuiltDependencies:
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"

# Skip the pre-run deps verification that re-triggers install and blocks tests
# in this environment (esbuild/prisma build scripts are already approved above).
verifyDepsBeforeRun: false
